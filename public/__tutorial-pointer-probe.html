<!doctype html><html lang="it"><meta charset="utf-8"><title>Controllo gesti locale</title><style>body{margin:0;background:#202725;color:#eee;font:24px system-ui;padding:40px}#surface{height:420px;margin:30px;border:2px solid #caba97;border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none}#card{padding:30px;margin:40px;width:260px;background:#caba97;color:#202725;border-radius:18px}pre{white-space:pre-wrap}</style><h1>Controllo gesti locale</h1><p>Trascina il riquadro. Nessun dato applicativo e nessuna connessione esterna.</p><div id="surface"><div id="card">Trascina da qui</div></div><pre id="result">In attesa del gesto</pre><script>const out=document.querySelector('#result'),card=document.querySelector('#card'),events=[];for(const type of ['pointerdown','pointermove','pointerup','pointercancel','mousedown','mousemove','mouseup','dragstart'])document.querySelector('#surface').addEventListener(type,e=>{if(type.includes('move')&&!e.buttons)return;events.push({tipo:type,premuti:e.buttons,x:Math.round(e.clientX),y:Math.round(e.clientY)});out.textContent=JSON.stringify(events.slice(-14),null,2);if(type==='pointerdown')card.setPointerCapture(e.pointerId);});</script></html>
